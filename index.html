<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17365d">
  <title>K200 Leak Detection Lookup</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #17365d;
      --blue: #e7f0f8;
      --line: #c9d4df;
      --text: #17212b;
      --muted: #5c6b78;
      --green: #08783e;
      --green-bg: #e8f6ee;
      --red: #a30d1b;
      --red-bg: #fff0f1;
      --amber: #8a5a00;
      --amber-bg: #fff8df;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #f3f6f9;
    }
    .app {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    }
    header { margin-bottom: 22px; text-align: center; }
    header h1 { margin: 0; color: var(--navy); font-size: clamp(1.5rem, 7vw, 2rem); line-height: 1.12; }
    header p { margin: 7px 0 0; color: var(--muted); font-size: .95rem; }
    .panel {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(23, 54, 93, .09);
    }
    label { display: block; margin: 0 0 7px; color: var(--navy); font-weight: 750; }
    select, input, button {
      width: 100%;
      min-height: 52px;
      border-radius: 11px;
      font: inherit;
    }
    select, input {
      border: 2px solid #9fb1c2;
      background: #fff;
      color: var(--text);
      padding: 10px 13px;
      font-size: 1.1rem;
    }
    select:focus, input:focus { outline: 3px solid rgba(44, 116, 179, .22); border-color: #2c74b3; }
    .field + .field { margin-top: 17px; }
    .hint { margin: 6px 1px 0; color: var(--muted); font-size: .82rem; }
    button {
      margin-top: 20px;
      border: 0;
      background: var(--navy);
      color: #fff;
      font-size: 1.08rem;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: translateY(1px); background: #102c4f; }
    .result {
      display: none;
      margin-top: 18px;
      padding: 20px 18px;
      border: 2px solid var(--line);
      border-radius: 16px;
      text-align: center;
    }
    .result.show { display: block; }
    .result.nccs { border-color: var(--green); background: var(--green-bg); }
    .result.itsd { border-color: var(--red); background: var(--red-bg); }
    .result.warning { border-color: #d29a28; background: var(--amber-bg); }
    .result-label { color: var(--muted); font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .location { margin-top: 3px; color: var(--navy); font-size: clamp(2.5rem, 14vw, 4.4rem); font-weight: 900; line-height: 1; letter-spacing: -.03em; }
    .badge { display: inline-block; margin-top: 12px; padding: 6px 11px; border-radius: 999px; color: #fff; font-size: .84rem; font-weight: 900; letter-spacing: .04em; }
    .nccs .badge { background: var(--green); }
    .itsd .badge { background: var(--red); }
    .alert { margin: 12px 0 0; font-size: 1rem; font-weight: 800; }
    .itsd .alert { color: var(--red); }
    .nccs .alert { color: var(--green); }
    .detail { margin: 8px 0 0; color: var(--muted); font-size: .88rem; }
    .edge-note { display: none; margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); font-size: .82rem; font-weight: 700; }
    .edge-note.show { display: block; }
    footer { margin-top: 17px; color: var(--muted); text-align: center; font-size: .75rem; }
    @media (max-width: 360px) { .app { padding-left: 12px; padding-right: 12px; } .panel { padding: 16px; } }
    @media print { body { background: #fff; } .app { width: 100%; padding: 0; } .panel { box-shadow: none; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>K200 Leak Detection</h1>
      <p>Footage-to-grid location lookup</p>
    </header>

    <section class="panel" aria-labelledby="lookup-heading">
      <h2 id="lookup-heading" style="position:absolute;left:-9999px">Leak location lookup</h2>
      <div class="field">
        <label for="zone">Detection zone</label>
        <select id="zone">
          <option value="zone1">Zone 1</option>
          <option value="zone2">Zone 2</option>
        </select>
      </div>

      <div class="field">
        <label for="footage">Detected footage</label>
        <input id="footage" type="number" inputmode="decimal" min="0" step="any" placeholder="Enter footage" autocomplete="off">
        <p class="hint" id="rangeHint">Mapped points: 4–1,390 ft</p>
      </div>

      <button id="locate" type="button">Find grid location</button>

      <div id="result" class="result" role="status" aria-live="polite">
        <div class="result-label">Nearest grid location</div>
        <div id="location" class="location">—</div>
        <div id="badge" class="badge"></div>
        <p id="alert" class="alert"></p>
        <p id="detail" class="detail"></p>
        <p id="edgeNote" class="edge-note"></p>
      </div>
    </section>

    <footer>Works offline · Uses the edited NCCS and ITSD lookup sheets</footer>
  </main>

    const zoneSelect = document.getElementById('zone');
    const footageInput = document.getElementById('footage');
    const locateButton = document.getElementById('locate');
    const result = document.getElementById('result');
    const locationOutput = document.getElementById('location');
    const badge = document.getElementById('badge');
    const alertText = document.getElementById('alert');
    const detail = document.getElementById('detail');
    const edgeNote = document.getElementById('edgeNote');
    const rangeHint = document.getElementById('rangeHint');

    function formatFeet(value) {
      return new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 }).format(value) + ' ft';
    }

    function nearestPoint(points, target) {
      let low = 0;
      let high = points.length - 1;
      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        if (points[mid].footage === target) return points[mid];
        if (points[mid].footage < target) low = mid + 1;
        else high = mid - 1;
      }
      if (high < 0) return points[0];
      if (low >= points.length) return points[points.length - 1];
      const below = points[high];
      const above = points[low];
      return (target - below.footage <= above.footage - target) ? below : above;
    }

    function updateRangeHint() {
      const points = LOOKUP_DATA[zoneSelect.value];
      rangeHint.textContent = 'Mapped points: ' + formatFeet(points[0].footage) + '–' + formatFeet(points[points.length - 1].footage);
      result.className = 'result';
    }

    function showLookup() {
      const raw = footageInput.value.trim();
      const target = Number(raw);
      if (raw === '' || !Number.isFinite(target) || target < 0) {
        result.className = 'result warning show';
        locationOutput.textContent = '—';
        badge.textContent = 'CHECK ENTRY';
        badge.style.background = '#8a5a00';
        alertText.textContent = 'Enter a valid footage reading of zero or greater.';
        detail.textContent = '';
        edgeNote.className = 'edge-note';
        footageInput.focus();
        return;
      }

      const points = LOOKUP_DATA[zoneSelect.value];
      const point = nearestPoint(points, target);
      const isItsd = point.jurisdiction === 'ITSD';
      result.className = 'result ' + (isItsd ? 'itsd' : 'nccs') + ' show';
      badge.style.background = '';
      locationOutput.textContent = point.location;
      badge.textContent = isItsd ? 'ITSD AREA' : 'NCCS AREA';
      alertText.textContent = isItsd
        ? 'OUTSIDE NCCS JURISDICTION — no NCCS response required.'
        : 'Within NCCS jurisdiction.';
      const difference = Math.abs(target - point.footage);
      detail.textContent = 'Entered ' + formatFeet(target) + ' · nearest mapped point ' + formatFeet(point.footage) +
        (difference ? ' · difference ' + formatFeet(difference) : ' · exact match');

      const outside = target < points[0].footage || target > points[points.length - 1].footage;
      edgeNote.className = 'edge-note' + (outside ? ' show' : '');
      edgeNote.textContent = outside ? 'Reading is outside the mapped footage span; the nearest endpoint was used.' : '';
    }

    zoneSelect.addEventListener('change', updateRangeHint);
    locateButton.addEventListener('click', showLookup);
    footageInput.addEventListener('keydown', event => { if (event.key === 'Enter') showLookup(); });
    updateRangeHint();
  </script>
